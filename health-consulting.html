<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health Consulting</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f6f7fb;
        color: #111827;
      }
      header {
        background: linear-gradient(135deg, #0ea5e9 0%, #22c55e 100%);
        color: white;
        padding: 24px 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(2, 132, 199, 0.25);
      }
      header h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
      }
      header p {
        margin: 12px auto 0;
        max-width: 54ch;
        color: rgba(255, 255, 255, 0.95);
        font-size: 1rem;
      }
      .page-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 20px auto 0;
      }
      .link-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 9999px;
        text-decoration: none;
        font-weight: 700;
        color: #0f172a;
        background: #e2e8f0;
        border: 1px solid rgba(15, 23, 42, 0.12);
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      .link-button:hover {
        background: #dbeafe;
        transform: translateY(-1px);
      }
      .search-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 680px;
        margin: 18px auto 0;
        background: #fff;
        border-radius: 9999px;
        padding: 8px 14px;
        border: 1px solid rgba(15, 23, 42, 0.1);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      }
      .search-bar input[type="search"] {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 1rem;
        padding: 12px 10px;
        color: #111827;
      }
      .search-bar input[type="search"]::placeholder {
        color: #94a3b8;
      }
      .search-submit {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 50%;
        background: linear-gradient(135deg, #0ea5e9 0%, #22c55e 100%);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease;
      }
      .consult-card {
        background: #fff;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        border: 1px solid rgba(15, 23, 42, 0.08);
      }
      .consult-card-link {
        display: block;
        height: 100%;
        box-sizing: border-box;
        color: inherit;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      .consult-card-link:hover,
      .consult-card-link:focus-visible {
        background: #f0fdf4;
      }
      .consult-card-link:focus-visible {
        outline: 3px solid rgba(14, 165, 233, 0.45);
        outline-offset: -3px;
      }
      .consult-card-image-wrap {
        aspect-ratio: 16 / 10;
        overflow: hidden;
        background: #e2e8f0;
      }
      .consult-card-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.25s ease;
      }
      .consult-card-link:hover .consult-card-image,
      .consult-card-link:focus-visible .consult-card-image {
        transform: scale(1.04);
      }
      .consult-card-body {
        padding: 18px;
      }
      .consult-card-title {
        margin: 0 0 10px;
        font-size: 1.125rem;
        font-weight: 700;
        color: #0f172a;
      }
      .consult-card-text {
        margin: 0;
        color: #475569;
        line-height: 1.6;
      }
      .selection-feedback {
        margin: 24px 0 0;
        padding: 16px 18px;
        border-left: 4px solid #22c55e;
        background: #f0fdf4;
        color: #166534;
        line-height: 1.5;
      }
      .content {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      @media (max-width: 840px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .search-feedback {
        margin: 12px auto 0;
        max-width: 680px;
        color: #0f172a;
        text-align: center;
      }
      footer {
        text-align: center;
        padding: 18px 16px 32px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Health Consulting</h1>
      <p>
        Choose a specialty, get personalized health advice, and connect with the
        right care team.
      </p>
      <div class="page-actions">
        <a class="link-button" href="health.html">Back to Home</a>
      </div>
      <form class="search-bar" id="consult-search-form" role="search">
        <label for="consult-search" class="visually-hidden"
          >Search consulting services</label
        >
        <input
          type="search"
          id="consult-search"
          name="consult-search"
          placeholder="Search consulting services on this page…"
          autocomplete="off"
        />
        <button type="submit" class="search-submit" aria-label="Submit search">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
        </button>
      </form>
      <p id="consult-search-feedback" class="search-feedback" hidden></p>
    </header>

    <main class="content">
      <div class="grid" id="consulting-grid"></div>
      <p id="consultation-request" class="selection-feedback">
        Select a specialty above to continue with consultation booking.
      </p>
    </main>

    <footer>Copyright &copy; <span id="year"></span></footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      const defaultConsultingOptions = [
        {
          title: "OPT / Optometry",
          description:
            "Eye examinations, glasses guidance, and everyday vision care.",
          image:
            "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=800&q=80",
          alt: "Optometrist examining a patient's eyes",
        },
        {
          title: "Child Care",
          description:
            "Pediatric advice for your child's growth, wellness, and care.",
          image:
            "https://images.unsplash.com/photo-1476703993599-0035a21b17a9?w=800&q=80",
          alt: "Child receiving friendly health care",
        },
        {
          title: "Vision Care",
          description:
            "Support for eye strain, vision concerns, and regular checkups.",
          image:
            "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=800&q=80",
          alt: "Eyeglasses for vision care",
        },
        {
          title: "Heart Care",
          description:
            "Cardiovascular guidance, prevention advice, and follow-up care.",
          image:
            "https://images.unsplash.com/photo-1530026186672-2cd00ffc50fe?w=800&q=80",
          alt: "Heart health monitor and stethoscope",
        },
        {
          title: "Lung & Respiratory Care",
          description:
            "Help with breathing concerns, respiratory health, and wellness.",
          image:
            "https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=800&q=80",
          alt: "Doctor supporting respiratory care",
        },
        {
          title: "General Physician",
          description:
            "First-step guidance for common symptoms and general health.",
          image:
            "https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=800&q=80",
          alt: "General physician consulting with a patient",
        },
        {
          title: "OPD",
          description:
            "Outpatient consultation for diagnosis, treatment, and follow-up care.",
          image:
            "https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=800&q=80",
          alt: "Light-complexioned Indian male doctor ready for an outpatient consultation",
        },
        {
          title: "Emergency Care",
          description:
            "Urgent medical guidance and help finding immediate emergency support.",
          image:
            "https://images.unsplash.com/photo-1584982751601-97dcc096659c?w=800&q=80",
          alt: "Emergency medical team providing care",
        },
      ];

      function getConsultingOptions() {
        try {
          const stored = JSON.parse(
            localStorage.getItem("superAdmin:consultingOptions"),
          );
          return Array.isArray(stored) ? stored : defaultConsultingOptions;
        } catch {
          return defaultConsultingOptions;
        }
      }

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character],
        );
      }

      function renderConsultingOptions() {
        const grid = document.getElementById("consulting-grid");
        if (!grid) return;
        grid.innerHTML = getConsultingOptions()
          .map(
            (option) => `
              <article class="consult-card">
                  <a class="consult-card-link" href="#consultation-request" data-specialty="${escapeHtml(option.title)}">
                  <div class="consult-card-image-wrap">
                    <img class="consult-card-image" src="${escapeHtml(option.image)}" alt="${escapeHtml(option.alt)}" width="800" height="500" loading="lazy" />
                  </div>
                  <div class="consult-card-body">
                    <h2 class="consult-card-title">${escapeHtml(option.title)}</h2>
                    <p class="consult-card-text">${escapeHtml(option.description)}</p>
                  </div>
                </a>
              </article>`,
          )
          .join("");
      }

      renderConsultingOptions();

      (function () {
        const form = document.getElementById("consult-search-form");
        const input = document.getElementById("consult-search");
        const feedback = document.getElementById("consult-search-feedback");
        const cards = Array.from(document.querySelectorAll(".consult-card"));

        function updateFeedback(message, hidden = false) {
          if (!feedback) return;
          feedback.textContent = message;
          feedback.hidden = hidden;
        }

        if (form && input && feedback) {
          form.addEventListener("submit", (event) => {
            event.preventDefault();
            const searchTerm = input.value.trim().toLowerCase();
            if (!searchTerm) {
              cards.forEach((card) => {
                card.hidden = false;
              });
              updateFeedback("", true);
              return;
            }

            let found = false;
            cards.forEach((card) => {
              const text = card.textContent.toLowerCase();
              const matches = text.includes(searchTerm);
              card.hidden = !matches;
              if (matches) found = true;
            });

            updateFeedback(
              found
                ? `Showing results for "${input.value}".`
                : `No consulting services found for "${input.value}".`,
              false,
            );
          });
        }

        document.querySelectorAll("[data-specialty]").forEach((link) => {
          link.addEventListener("click", () => {
            const specialty = link.dataset.specialty;
            const selection = document.getElementById("consultation-request");
            if (selection && specialty) {
              selection.textContent = `${specialty} selected. Consultation booking will be available soon.`;
            }
          });
        });
      })();
    </script>
  </body>
</html>
