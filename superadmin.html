<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Super Admin Controller</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8fafc;
        color: #111827;
      }
      header {
        background: linear-gradient(135deg, #0ea5e9 0%, #22c55e 100%);
        color: white;
        padding: 28px 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(2, 132, 199, 0.25);
      }
      header h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
      }
      header p {
        margin: 12px auto 0;
        max-width: 60ch;
        color: rgba(255, 255, 255, 0.95);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      .control-card {
        background: #fff;
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        padding: 24px;
      }
      .control-card h2 {
        margin: 0 0 16px;
        font-size: 1.25rem;
        color: #0f172a;
      }
      .toggle-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid #e5e7eb;
      }
      .toggle-row:last-child {
        border-bottom: none;
      }
      .toggle-label {
        margin: 0;
        font-weight: 600;
        color: #111827;
      }
      .toggle-control {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .toggle-control input {
        width: 18px;
        height: 18px;
        accent-color: #0ea5e9;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 9999px;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      .btn-save {
        background: #0ea5e9;
        color: white;
      }
      .btn-reset {
        background: #e2e8f0;
        color: #0f172a;
      }
      .btn-back {
        background: #fff;
        color: #0f172a;
        border: 1px solid rgba(15, 23, 42, 0.12);
        text-decoration: none;
      }
      .status {
        margin-top: 18px;
        min-height: 20px;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Super Admin Controller</h1>
      <p>
        Control visibility of the health application sections from one place.
      </p>
    </header>

    <main>
      <section class="control-card" aria-label="Admin visibility controls">
        <h2>Visibility settings</h2>
        <div class="toggle-row">
          <p class="toggle-label">Food products section</p>
          <label class="toggle-control">
            <input type="checkbox" id="toggle-food" />
            Show
          </label>
        </div>
        <div class="toggle-row">
          <p class="toggle-label">Vitamins & tablets section</p>
          <label class="toggle-control">
            <input type="checkbox" id="toggle-vitamins" />
            Show
          </label>
        </div>
        <div class="toggle-row">
          <p class="toggle-label">Health consulting section</p>
          <label class="toggle-control">
            <input type="checkbox" id="toggle-consulting" />
            Show
          </label>
        </div>
        <div class="toggle-row">
          <p class="toggle-label">Top search bar</p>
          <label class="toggle-control">
            <input type="checkbox" id="toggle-search" />
            Show
          </label>
        </div>
        <div class="toggle-row">
          <p class="toggle-label">Developer option in profile menu</p>
          <div class="toggle-control">
            <button type="button" class="btn btn-reset" id="toggle-developer">
              Show Developer option
            </button>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-save" id="save-settings">
            Save settings
          </button>
          <button type="button" class="btn btn-reset" id="reset-settings">
            Reset to defaults
          </button>
          <a class="btn btn-back" href="health.html">Open Health App</a>
        </div>

        <div class="status" id="status-message" aria-live="polite"></div>
      </section>
    </main>

    <script>
      const keys = {
        food: "superAdmin:showFood",
        vitamins: "superAdmin:showVitamins",
        consulting: "superAdmin:showConsulting",
        search: "superAdmin:showSearch",
        developer: "superAdmin:showDeveloper",
      };

      const controls = {
        food: document.getElementById("toggle-food"),
        vitamins: document.getElementById("toggle-vitamins"),
        consulting: document.getElementById("toggle-consulting"),
        search: document.getElementById("toggle-search"),
      };

      const developerButton = document.getElementById("toggle-developer");
      const status = document.getElementById("status-message");

      function getStoredValue(key) {
        const value = localStorage.getItem(key);
        return value === null ? true : value === "true";
      }

      function setDeveloperButtonState(isVisible) {
        if (!developerButton) return;
        developerButton.textContent = isVisible
          ? "Hide Developer option"
          : "Show Developer option";
        developerButton.dataset.visible = isVisible ? "true" : "false";
      }

      function loadSettings() {
        Object.entries(keys).forEach(([section, key]) => {
          if (section === "developer") return;
          const checkbox = controls[section];
          if (!checkbox) return;
          checkbox.checked = getStoredValue(key);
        });
        setDeveloperButtonState(getStoredValue(keys.developer));
      }

      function saveSettings() {
        Object.entries(keys).forEach(([section, key]) => {
          if (section === "developer") return;
          const checkbox = controls[section];
          if (!checkbox) return;
          localStorage.setItem(key, checkbox.checked ? "true" : "false");
        });
        if (developerButton) {
          localStorage.setItem(
            keys.developer,
            developerButton.dataset.visible === "true" ? "true" : "false",
          );
        }
        status.textContent =
          "Settings saved. Refresh the Health app to apply changes.";
      }

      function toggleDeveloperOption() {
        if (!developerButton) return;
        const isVisible = developerButton.dataset.visible !== "true";
        setDeveloperButtonState(isVisible);
        localStorage.setItem(keys.developer, isVisible ? "true" : "false");
        status.textContent = isVisible
          ? "Developer option is now visible in the profile menu."
          : "Developer option has been removed from the profile menu.";
      }

      function resetSettings() {
        Object.values(keys).forEach((key) => localStorage.removeItem(key));
        loadSettings();
        status.textContent = "Settings reset to defaults.";
      }

      document
        .getElementById("save-settings")
        .addEventListener("click", saveSettings);
      document
        .getElementById("reset-settings")
        .addEventListener("click", resetSettings);
      if (developerButton) {
        developerButton.addEventListener("click", toggleDeveloperOption);
      }

      loadSettings();
    </script>
  </body>
</html>
