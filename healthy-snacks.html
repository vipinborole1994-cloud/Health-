<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthy Snack Packs</title>
    <style>
      :root {
        --ink: #2d3529;
        --muted: #697367;
        --green: #53754a;
        --cream: #f8f7ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--cream);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      .page {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 64px 0 72px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--green);
        font:
          700 0.78rem/1.2 Arial,
          sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 700px;
        margin: 0;
        font-size: clamp(2.6rem, 6vw, 5.2rem);
        line-height: 0.98;
        font-weight: 500;
      }

      .intro {
        max-width: 620px;
        margin: 22px 0 42px;
        color: var(--muted);
        font:
          1.05rem/1.6 Arial,
          sans-serif;
      }

      .snack-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 18px;
      }

      .snack-tile {
        grid-column: span 4;
        overflow: hidden;
        padding: 0;
        border: 1px solid #dfe6d8;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .snack-tile:first-child,
      .snack-tile:nth-child(2) {
        grid-column: span 6;
      }

      .snack-tile:hover,
      .snack-tile:focus-visible {
        transform: translateY(-4px);
        box-shadow: 0 14px 30px rgba(54, 78, 45, 0.15);
        outline: none;
      }

      .snack-tile img {
        display: block;
        width: 100%;
        height: 230px;
        object-fit: cover;
      }

      .snack-info {
        display: block;
        padding: 20px 20px 22px;
      }

      .snack-info h2 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 500;
      }

      .snack-info p {
        margin: 0;
        color: var(--muted);
        font:
          0.92rem/1.5 Arial,
          sans-serif;
      }

      .tag {
        display: inline-block;
        margin-top: 16px;
        padding: 6px 10px;
        border-radius: 999px;
        background: #e8f0df;
        color: var(--green);
        font:
          700 0.72rem Arial,
          sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      @media (max-width: 760px) {
        .page {
          padding: 42px 0 50px;
        }

        .snack-tile,
        .snack-tile:first-child,
        .snack-tile:nth-child(2) {
          grid-column: 1 / -1;
        }

        .snack-tile img {
          height: 210px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">Healthy snack packs</p>
      <h1>Good energy, packed simply.</h1>
      <p class="intro">
        Five nourishing snack choices made with fruit, nuts, seeds, yogurt, and
        roasted ingredients for easy everyday energy.
      </p>

      <section class="snack-grid" aria-label="Healthy snack options">
        <button class="snack-tile" type="button">
          <img
            src="https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?w=900&q=80"
            alt="Fruit and nut trail mix"
          />
          <span class="snack-info">
            <h2>Fruit and Nut Mix</h2>
            <p>Almonds, walnuts, pumpkin seeds, raisins, and dried berries.</p>
            <span class="tag">Protein rich</span>
          </span>
        </button>

        <button class="snack-tile" type="button">
          <img
            src="https://images.unsplash.com/photo-1559181567-c3190ca9959b?w=900&q=80"
            alt="Fresh apple slices with nuts"
          />
          <span class="snack-info">
            <h2>Apple Crunch Cup</h2>
            <p>Crisp apple slices, sunflower seed butter, and cinnamon.</p>
            <span class="tag">Fresh fruit</span>
          </span>
        </button>

        <button class="snack-tile" type="button">
          <img
            src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?w=900&q=80"
            alt="Healthy vegetable snack plate"
          />
          <span class="snack-info">
            <h2>Veggie Hummus Box</h2>
            <p>Carrot, cucumber, peppers, snap peas, and creamy hummus.</p>
            <span class="tag">Vegetable packed</span>
          </span>
        </button>

        <button class="snack-tile" type="button">
          <img
            src="https://images.unsplash.com/photo-1488477181946-6428a0291777?w=900&q=80"
            alt="Yogurt berry parfait"
          />
          <span class="snack-info">
            <h2>Berry Yogurt Pot</h2>
            <p>Greek yogurt, berries, toasted oats, and a little honey.</p>
            <span class="tag">Calcium source</span>
          </span>
        </button>

        <button class="snack-tile" type="button">
          <img
            src="https://images.unsplash.com/photo-1547592180-85f173990554?w=900&q=80"
            alt="Roasted chickpea snack"
          />
          <span class="snack-info">
            <h2>Roasted Chickpeas</h2>
            <p>Crunchy chickpeas seasoned with paprika, herbs, and lemon.</p>
            <span class="tag">High fibre</span>
          </span>
        </button>
      </section>
    </main>

    <script>
      document.querySelectorAll(".snack-tile").forEach((tile) => {
        tile.addEventListener("click", () => {
          document.querySelectorAll(".snack-tile").forEach((item) => {
            item.removeAttribute("aria-pressed");
          });
          tile.setAttribute("aria-pressed", "true");
        });
      });
    </script>
  </body>
</html>
